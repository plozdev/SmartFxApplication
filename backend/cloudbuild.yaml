steps:
  # Step 1: Build Docker image with both SHA and latest tags
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/smartfx-repo/smartfx:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/smartfx-repo/smartfx:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/smartfx-repo/smartfx']
    id: 'push-image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smartfx'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/smartfx-repo/smartfx:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
    id: 'deploy-cloud-run'

# Push image configuration
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/smartfx-repo/smartfx:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/smartfx-repo/smartfx:latest'

# Build configuration
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'smartfx'

timeout: '1800s'
